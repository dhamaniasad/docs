<svg viewBox="0 0 720 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The AI proposes edits — remove, combine, update — but nothing is written until you approve. Approved edits update your memory.">
  <style>
    .card{fill:#27272a;stroke:#3f3f46;stroke-width:1;}
    .card-accent{fill:rgba(129,140,248,0.16);stroke:#818cf8;stroke-width:1.5;}
    .card-dash{fill:#27272a;stroke:#3f3f46;stroke-width:1;stroke-dasharray:5 4;}
    .pill{fill:#27272a;stroke:#3f3f46;stroke-width:1;}
    .pill-accent{fill:rgba(129,140,248,0.16);stroke:#818cf8;stroke-width:1.5;}
    .t{font-family:ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif;fill:#fafafa;font-size:15px;}
    .t-strong{font-family:ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif;fill:#fafafa;font-size:15px;font-weight:600;}
    .sub{font-family:ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif;fill:#a1a1aa;font-size:12.5px;}
    .accent-t{font-family:ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif;fill:#818cf8;font-size:12.5px;font-weight:600;}
    .faint{fill:#a1a1aa;}
    .edge{fill:none;stroke:#52525b;stroke-width:1.5;}
    .edge-accent{fill:none;stroke:#818cf8;stroke-width:1.75;}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- AI proposes (dashed = not yet written) -->
  <text x="40" y="40" class="sub">AI proposes</text>
  <rect class="card-dash" x="40" y="52" width="200" height="132" rx="12"/>
  <rect class="pill" x="62" y="72" width="156" height="30" rx="8"/>
  <text x="140" y="92" class="t" text-anchor="middle">Remove duplicate</text>
  <rect class="pill" x="62" y="108" width="156" height="30" rx="8"/>
  <text x="140" y="128" class="t" text-anchor="middle">Combine two</text>
  <rect class="pill" x="62" y="144" width="156" height="30" rx="8"/>
  <text x="140" y="164" class="t" text-anchor="middle">Update outdated</text>

  <!-- approval gate: the one accent element -->
  <line class="edge" x1="240" y1="118" x2="288" y2="118" marker-end="url(#a)"/>
  <rect class="card-accent" x="290" y="86" width="140" height="64" rx="12"/>
  <text x="360" y="112" class="t-strong" text-anchor="middle">You approve</text>
  <text x="360" y="131" class="sub" text-anchor="middle">or reject</text>

  <!-- applied -->
  <line class="edge-accent" x1="430" y1="118" x2="478" y2="118" marker-end="url(#aa)"/>
  <rect class="card" x="480" y="86" width="200" height="64" rx="12"/>
  <text x="580" y="112" class="t-strong" text-anchor="middle">Memory updated</text>
  <text x="580" y="131" class="sub" text-anchor="middle">Nothing changes until then</text>
</svg>
